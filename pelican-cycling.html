<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <link rel="icon" href="data:,">
  <title>兜风去。 · Pelican Cycling Club</title>
  <style>
    :root { color-scheme: light; --paper: #f5f2e9; --ink: #244c48; --muted: #70817a; --orange: #d76743; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 38px 6vw 25px; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(1160px, 100%); margin: auto; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid #244c4828; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 11px; line-height: 1.5; font-weight: 700; letter-spacing: 2px; }
    .brand svg { width: 35px; height: 35px; }
    .edition { font: 10px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: 1.8px; color: var(--muted); }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 29px 0 26px; }
    .eyebrow { margin: 0 0 10px; color: var(--orange); font: 10px/1.5 ui-monospace, monospace; letter-spacing: 3px; }
    h1 { margin: 0; font-size: clamp(36px, 5.1vw, 62px); font-weight: 650; letter-spacing: -.05em; line-height: 1.15; }
    .intro-copy { margin: 0 0 4px; font-size: 12px; line-height: 1.9; letter-spacing: 1px; color: var(--muted); }
    .postcard { position: relative; overflow: hidden; border: 1px solid #244c4820; border-radius: 5px; background: #f5e9d3; }
    #scene { width: 100%; height: auto; display: block; }
    .scene-label { position: absolute; top: 25px; left: 27px; font: 9px/1.8 ui-monospace, monospace; letter-spacing: 2.4px; color: #54736b; }
    .scene-label::before { content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 8px 1px 0; border-radius: 50%; background: #d76743; }
    .stamp { position: absolute; right: 24px; bottom: 23px; width: 64px; height: 64px; border: 1px solid #244c4860; border-radius: 50%; display: grid; place-content: center; text-align: center; transform: rotate(-12deg); font: 9px/1.6 ui-monospace, monospace; letter-spacing: 2px; color: #244c4895; }
    .stamp b { font-size: 17px; font-weight: 400; }
    .control-bar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 21px 0; border-bottom: 1px solid #244c4828; }
    .controls { display: flex; align-items: center; gap: 27px; }
    button { min-height: 42px; padding: 10px 18px; border: 1px solid var(--ink); border-radius: 30px; color: var(--paper); background: var(--ink); font: inherit; font-size: 11px; letter-spacing: 1px; cursor: pointer; display: flex; align-items: center; gap: 9px; }
    button:hover { background: #35665f; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 5px; }
    button svg { width: 12px; height: 12px; fill: currentColor; }
    .speed-control { display: flex; align-items: center; gap: 12px; font-size: 10px; letter-spacing: 1px; }
    input[type="range"] { accent-color: var(--orange); width: 110px; height: 24px; margin: 0; cursor: pointer; }
    output { min-width: 32px; font: 11px ui-monospace, monospace; color: var(--orange); }
    .ride-note { margin: 0; font-size: 11px; letter-spacing: 1px; color: var(--muted); }
    footer { display: flex; justify-content: space-between; gap: 15px; padding-top: 18px; color: var(--muted); font: 9px/1.6 ui-monospace, monospace; letter-spacing: 1.6px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 650px) {
      body { padding: 24px 5vw; }
      .masthead { padding-bottom: 18px; }
      .brand { font-size: 9px; letter-spacing: 1.5px; }
      .edition { font-size: 8px; letter-spacing: 1px; }
      .intro { padding: 25px 0 21px; align-items: flex-start; flex-direction: column; gap: 12px; }
      .intro-copy { font-size: 11px; }
      .intro-copy br { display: none; }
      .scene-label { top: 13px; left: 13px; font-size: 7px; letter-spacing: 1px; }
      .stamp { width: 40px; height: 40px; right: 11px; bottom: 11px; font-size: 6px; letter-spacing: 1px; }
      .stamp b { font-size: 11px; }
      .control-bar { align-items: flex-start; flex-direction: column; gap: 15px; padding: 18px 0; }
      .controls { width: 100%; justify-content: space-between; gap: 12px; }
      .speed-control { gap: 8px; }
      input[type="range"] { width: 85px; }
      button { padding: 10px 14px; }
      footer { font-size: 8px; letter-spacing: .7px; }
    }
    @media (max-width: 350px) { .controls { align-items: flex-start; flex-direction: column; } }
  </style>
</head>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const toggle = $('toggle');
      const speedInput = $('speed');
      const parts = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'crank', 'far-leg', 'far-foot', 'near-leg',
        'near-foot', 'near-pedal', 'pelican', 'scarf-tail', 'clouds', 'water',
        'verge-scroll', 'road-scroll', 'gulls', 'sailboat', 'eye'
      ].map(id => [id, $(id)]));
      let paused = motionPreference.matches;
      let speed = 1;
      let elapsed = 0;
      let previous = null;
      let frameId = null;

      function updateControls() {
        toggle.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        $('toggle-text').textContent = paused ? '继续兜风' : '歇一会儿';
        $('toggle-icon').setAttribute('d', paused ? 'M3 1 11 6 3 11z' : 'M2 1h3v10H2zM7 1h3v10H7z');
        $('ride-note').textContent = paused ? '停一下，听听海风。' : '不赶时间，刚刚好。';
      }

      function draw(time) {
        const phase = time * 2.7;
        const degrees = phase * 180 / Math.PI;
        const bob = Math.sin(phase * 2) * 1.7;
        const wheelDegrees = time * 105 / 84 * 180 / Math.PI;
        parts['rear-spokes'].setAttribute('transform', `rotate(${wheelDegrees % 360})`);
        parts['front-spokes'].setAttribute('transform', `rotate(${wheelDegrees % 360})`);
        parts.crank.setAttribute('transform', `translate(580 539) rotate(${degrees % 360})`);
        parts.pelican.setAttribute('transform', `translate(0 ${bob})`);
        // Both feet stay on opposite ends of the rotating crank. A two-link leg
        // keeps the knee bend natural without stretching either leg segment.
        for (const [side, offset, hipX] of [['near', 0, 555], ['far', Math.PI, 544]]) {
          const footX = 580 + Math.cos(phase + offset) * 28;
          const footY = 539 + Math.sin(phase + offset) * 28;
          const hipY = 416 + bob;
          const dx = footX - hipX;
          const dy = footY - hipY;
          const distance = Math.hypot(dx, dy);
          const upper = 83;
          const lower = 83;
          const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
          const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
          const kneeX = hipX + dx * along / distance + dy * bend / distance;
          const kneeY = hipY + dy * along / distance - dx * bend / distance;
          parts[`${side}-leg`].setAttribute('d', `M${hipX} ${hipY}L${kneeX} ${kneeY} ${footX} ${footY - 5}`);
          parts[`${side}-foot`].setAttribute('d', `M${footX - 8} ${footY - 4}q17-6 28 0`);
          if (side === 'near') parts['near-pedal'].setAttribute('d', `M${footX - 12} ${footY + 3}h29`);
        }
        const flutter = Math.sin(time * 7) * 6;
        parts['scarf-tail'].setAttribute('d', `M592 280Q543 ${252 + flutter} 494 ${279 + flutter}L501 ${263 + flutter} 485 ${255 + flutter}Q546 ${244 - flutter} 597 270Z`);
        parts.clouds.setAttribute('transform', `translate(${-((time * 9) % 1200)} 0)`);
        parts.water.setAttribute('transform', `translate(${-((time * 23) % 1200)} 0)`);
        parts['verge-scroll'].setAttribute('transform', `translate(${-((time * 105) % 1200)} 0)`);
        parts['road-scroll'].setAttribute('transform', `translate(${-((time * 105) % 1200)} 0)`);
        parts.gulls.setAttribute('transform', `translate(${Math.sin(time * .35) * 15} ${Math.sin(time * 1.2) * 3})`);
        parts.sailboat.setAttribute('transform', `translate(${991 + Math.sin(time * .1) * 20} ${356 + Math.sin(time * 1.1) * 1.5})`);
        const blink = time % 5.3 > 5.15 ? .12 : 1;
        parts.eye.setAttribute('transform', `translate(0 ${214 * (1 - blink)}) scale(1 ${blink})`);
      }

      function frame(now) {
        if (previous !== null) elapsed += Math.min((now - previous) / 1000, .05) * speed;
        previous = now;
        draw(elapsed);
        frameId = requestAnimationFrame(frame);
      }

      function syncPlayback() {
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        previous = null;
        if (!paused && !document.hidden) frameId = requestAnimationFrame(frame);
        updateControls();
      }

      toggle.addEventListener('click', () => { paused = !paused; syncPlayback(); });
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        $('speed-value').value = `${speed}×`;
        speedInput.setAttribute('aria-valuetext', `${speed} 倍速`);
      });
      motionPreference.addEventListener('change', event => { if (event.matches) { paused = true; syncPlayback(); } });
      document.addEventListener('visibilitychange', syncPlayback);
      draw(0);
      syncPlayback();
    })();
  </script>
</body>
</html>
